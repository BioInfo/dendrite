# cargo-deny configuration for Dendrite
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2026-0007",  # bytes BytesMut::reserve overflow (transitive dep, no exposure)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (transitive via indicatif)
    "RUSTSEC-2024-0436",  # paste unmaintained (transitive via candle)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MIT-0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"  # thiserror v1+v2 coexist via transitive deps
wildcards = "allow"  # Internal project, not published to crates.io
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"  # Allow git deps for candle
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
