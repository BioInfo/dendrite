name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No GPU here: CI checks that the code compiles and lints clean, and that the host-memory guard works in both
# directions. The correctness gates (gates/) need a CUDA GPU and a kev checkpoint; the README says how to run them.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check --select F dendrite gates
      - run: python3 -m compileall -q dendrite gates
  memguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m dendrite.memguard --selftest
