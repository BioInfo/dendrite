[project]
name = "dendrite"
version = "0.2.0"
description = "Fork-native serving for kev decision models: shared-state question branches and exact state reuse"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
# kev itself is installed separately (README, Install): it pins torch<2.9, and the GB10 needs torch 2.9 + cu130.
dependencies = [
    "transformers>=5.17,<6",
    "flash-linear-attention==0.5.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/BioInfo/dendrite"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dendrite"]

[tool.ruff]
line-length = 160

[tool.ruff.lint.per-file-ignores]
# the benchmark lambdas run before the loop's closing `del`, which ruff reads as an undefined name
"gates/*" = ["F821"]
